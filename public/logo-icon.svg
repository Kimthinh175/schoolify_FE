<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Royal Tech Blue to Cyan Linear Gradient for Top Cap -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Deep Blue Gradient for Bottom Base -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#subtleGlow)">
    <!-- Top Cap Diamond Frame (Rhombus) -->
    <path 
      d="M 128 32 L 216 76 L 128 120 L 40 76 Z" 
      fill="none" 
      stroke="url(#capGrad)" 
      stroke-width="22" 
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Inner Chevron / Open Book (Center) -->
    <path 
      d="M 94 136 L 128 156 L 162 136" 
      fill="none" 
      stroke="url(#capGrad)" 
      stroke-width="18" 
      stroke-linejoin="round" 
      stroke-linecap="round" 
    />

    <!-- Left Tassel -->
    <path 
      d="M 64 96 L 64 136" 
      stroke="url(#baseGrad)" 
      stroke-width="18" 
      stroke-linecap="round" 
    />
    <circle cx="64" cy="144" r="9" fill="url(#baseGrad)" />

    <!-- Bottom Hexagon / Academic Shield Base -->
    <path 
      d="M 62 174 L 128 214 L 194 174" 
      fill="none" 
      stroke="url(#baseGrad)" 
      stroke-width="22" 
      stroke-linejoin="round" 
      stroke-linecap="round" 
    />

    <!-- Side Pillars connecting Cap to Base -->
    <line x1="194" y1="126" x2="194" y2="168" stroke="url(#baseGrad)" stroke-width="18" stroke-linecap="round" />
  </g>
</svg>
