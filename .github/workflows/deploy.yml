name: Deploy Schoolify FE to s68

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & Build Next.js standalone
        env:
          NEXT_PUBLIC_BE_URL: ${{ secrets.NEXT_PUBLIC_BE_URL || 'http://127.0.0.1:3005' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '353464933030-gs4nius9ik1kikb6meq9acigl5kju766.apps.googleusercontent.com' }}
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next .next/standalone/data
          cp -r .next/static .next/standalone/.next/static
          cp -rn data/* .next/standalone/data/ || true

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync standalone bundle to server
        run: |
          rsync -az --delete \
            --filter='P data/' \
            --filter='P .env' \
            --filter='P .env.*' \
            --exclude='*.md' \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            .next/standalone/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/apps/schoolify/fe/"

      - name: Reload PM2 & healthcheck
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            export PATH="/opt/plesk/node/24/bin:$PATH"
            pm2 reload /opt/apps/schoolify/ecosystem.config.cjs --only schoolify-fe --update-env || pm2 start /opt/apps/schoolify/ecosystem.config.cjs --only schoolify-fe
            pm2 save
            sleep 3
            curl -sfI http://127.0.0.1:3050/ >/dev/null
          '
