name: Deploy Schoolify FE to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & Build Next.js standalone
        env:
          NEXT_PUBLIC_BE_URL: ${{ secrets.NEXT_PUBLIC_BE_URL || 'http://127.0.0.1:3005' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '353464933030-gs4nius9ik1kikb6meq9acigl5kju766.apps.googleusercontent.com' }}
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next .next/standalone/data
          cp -r .next/static .next/standalone/.next/static
          cp -rn data/* .next/standalone/data/ || true

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Rsync standalone bundle to server
        run: |
          DEPLOY_USER="${{ secrets.SSH_USER }}"
          if [ -z "$DEPLOY_USER" ] || [ "$DEPLOY_USER" = "root" ]; then
            DEPLOY_USER="ubuntu"
          fi
          rsync -az --delete \
            --filter='P data/' \
            --filter='P .env' \
            --filter='P .env.*' \
            --exclude='*.md' \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            .next/standalone/ \
            "${DEPLOY_USER}@${{ secrets.SSH_HOST }}:/opt/apps/schoolify/fe/"

      - name: Reload PM2 & healthcheck
        run: |
          DEPLOY_USER="${{ secrets.SSH_USER }}"
          if [ -z "$DEPLOY_USER" ] || [ "$DEPLOY_USER" = "root" ]; then
            DEPLOY_USER="ubuntu"
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${{ secrets.SSH_HOST }}" '
            set -e
            pm2 startOrReload /opt/apps/schoolify/ecosystem.config.cjs --only schoolify-fe --update-env
            pm2 save
            sleep 3
            curl -sfI http://127.0.0.1:3050/ >/dev/null
          '
