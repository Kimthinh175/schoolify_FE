name: Temp Export SSH Key

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export SSH private key
        run: |
          mkdir -p key
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > key/id_rsa
          chmod 600 key/id_rsa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key-temp
          path: key/
          retention-days: 1
